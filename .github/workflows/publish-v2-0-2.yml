name: Publish BDB Audit v2.0.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-bdb-audit-v2-0-2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect v2.0.2 release source
        id: gate
        shell: pwsh
        run: |
          $text = Get-Content -Raw src/bdb_audit/cli.py
          if ($text -match 'APP_VERSION\s*=\s*"2\.0\.2"' -and $text -match 'BUILD_ID\s*=\s*"BDB-V2-STANDALONE-2\.0\.2"') {
            "release_ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "v2.0.2 release source detected"
          } else {
            "release_ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Not a v2.0.2 release source; publication skipped"
          }

      - name: Set up Python 3.14
        if: steps.gate.outputs.release_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install exact runtime closure and qualification tools
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-f2.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest==9.1.1 ruff==0.16.7 mypy==2.3.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Final pytest qualification
        id: pytest_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -m pytest -q

      - name: Final Ruff qualification
        id: ruff_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -m ruff check src build

      - name: Final Mypy qualification
        id: mypy_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -m mypy --config-file pyproject.toml

      - name: Build standalone
        id: build_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python build/build_single_file_v2_0_2.py

      - name: Standalone version smoke
        id: standalone_version_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -I dist/BDB_AUDIT_ASSISTANT_v2.0.2.py --version

      - name: Standalone payload smoke
        id: standalone_payload_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -I dist/BDB_AUDIT_ASSISTANT_v2.0.2.py --verify-payload

      - name: Standalone self-test smoke
        id: standalone_selftest_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -I dist/BDB_AUDIT_ASSISTANT_v2.0.2.py self-test

      - name: Standalone help smoke
        id: standalone_help_gate
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: python -I dist/BDB_AUDIT_ASSISTANT_v2.0.2.py --help

      - name: Prepare release evidence
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        run: |
          $artifactHash = (Get-FileHash dist/BDB_AUDIT_ASSISTANT_v2.0.2.py -Algorithm SHA256).Hash.ToLower()
          "SHA256=$artifactHash" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          $smokeOutcomes = @(
            "${{ steps.standalone_version_gate.outcome }}",
            "${{ steps.standalone_payload_gate.outcome }}",
            "${{ steps.standalone_selftest_gate.outcome }}",
            "${{ steps.standalone_help_gate.outcome }}"
          )
          $standaloneSmoke = if (@($smokeOutcomes | Where-Object { $_ -ne "success" }).Count -eq 0) { "PASS" } else { "FAIL" }
          $qualification = [ordered]@{
            release = "BDB Audit v2.0.2"
            tag = "bdb-audit-v2.0.2"
            commit = $env:GITHUB_SHA
            python = "3.14"
            platform = "windows-latest"
            pytest = "${{ steps.pytest_gate.outcome }}"
            ruff = "${{ steps.ruff_gate.outcome }}"
            mypy = "${{ steps.mypy_gate.outcome }}"
            build = "${{ steps.build_gate.outcome }}"
            standalone_smoke = $standaloneSmoke
            artifact_sha256 = $artifactHash
          }
          $qualification | ConvertTo-Json | Set-Content -Encoding utf8 dist/V2_0_2_RELEASE_QUALIFICATION.json
          @"
          # BDB Audit v2.0.2

          Patch release for the missing operational STOP-gate path discovered during live v2.0.1 campaign testing.

          ## Fixes
          - adds a real STOP Gate action to the interactive UI;
          - adds `stop evaluate` to the CLI;
          - evaluates the latest accepted `stop_input` when available;
          - fails closed with `MISSING_ACCEPTED_STOP_INPUT` instead of leaving the campaign at an impossible next action;
          - supports explicit STOP-input files as non-authoritative previews only;
          - verifies campaign/head binding before evaluating a STOP input;
          - preserves the v2.0.1 canonical E1-E5 stage and lane projection fixes.

          ## Standalone
          `BDB_AUDIT_ASSISTANT_v2.0.2.py`

          SHA-256: `$artifactHash`

          Release commit: `$env:GITHUB_SHA`
          "@ | Set-Content -Encoding utf8 dist/RELEASE_NOTES_v2.0.2.md

      - name: Create annotated tag and stable GitHub Release
        if: steps.gate.outputs.release_ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "bdb-audit-v2.0.2"
          if (git ls-remote --tags origin "refs/tags/$tag" | Select-String .) {
            throw "Tag $tag already exists; refusing to overwrite"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to overwrite"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $env:GITHUB_SHA -m "BDB Audit v2.0.2"
          git push origin "refs/tags/$tag"
          gh release create $tag `
            "dist/BDB_AUDIT_ASSISTANT_v2.0.2.py" `
            "dist/SHA256SUMS.txt" `
            "dist/V2_0_2_RELEASE_QUALIFICATION.json" `
            --repo $env:GITHUB_REPOSITORY `
            --title "BDB Audit v2.0.2" `
            --notes-file "dist/RELEASE_NOTES_v2.0.2.md" `
            --verify-tag
